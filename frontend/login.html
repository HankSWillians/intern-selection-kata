<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b4a7a" />
    <title>Ingreso del analista · Selección de Practicantes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/login.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span>Selección de Practicantes</a>
        <nav class="nav" aria-label="Principal" data-nav></nav>
      </div>
    </header>
    <main class="content">
      <form class="card login" id="login-form" novalidate>
        <h1>Ingreso del analista</h1>
        <p class="lead">Solo el equipo de selección puede ver el panel de practicantes.</p>

        <div class="alert alert-info" role="status" data-expired hidden>Tu sesión expiró. Vuelve a iniciar sesión.</div>
        <div class="alert alert-error" role="alert" data-error hidden></div>

        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <button type="submit" class="btn btn-primary" data-submit>Ingresar</button>
      </form>
    </main>
  </body>
</html>
