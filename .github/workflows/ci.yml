# ============================================================
# CI — pruebas del backend (Flask) y del frontend (Playwright)
# ============================================================
# Un único workflow que termina en `CI Gate`, el check obligatorio
# de `main`.
#
# En los PRs NO se filtra por rutas con `paths`/`paths-ignore`: si
# un PR no toca `backend/`, un workflow filtrado no se dispara, su
# check nunca reporta y el PR queda bloqueado para siempre. En cambio,
# un job SALTADO dentro de un workflow que sí corrió cuenta como
# éxito. Por eso el filtrado se hace por dentro, en el job `changes`.
#
# Ahorro de minutos de Actions:
#   - Solo se compila el componente que cambió.
#   - Los PRs en Draft no gastan runners; la CI corre al marcarlos
#     como listos (`ready_for_review`).
#   - Un push nuevo cancela la ejecución anterior del mismo PR.
#   - En `main` no se revalidan cambios que solo tocan documentación.
#   - Los jobs ligeros usan `ubuntu-slim` (1 vCPU) y todos tienen
#     `timeout-minutes`, para que un job colgado no consuma horas.
#
# Mientras `backend/requirements.txt` no exista, el job se omite y
# `CI Gate` pasa en verde. El frontend es HTML, CSS y JS sin compilar:
# lo prueban las pruebas de Playwright dentro del job de Python, con el
# Google Chrome del runner.
#
# NO renombrar el job `CI Gate`: el ruleset de `main` lo exige por
# nombre exacto.
# ============================================================

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # Solo en `main`, que no es un check obligatorio. Si un push mezcla
    # documentación y código, la CI sí corre.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # En `main` no se cancela: cada commit debe validarse entero.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ----------------------------------------------------------
  # 1. Qué cambió
  # ----------------------------------------------------------
  changes:
    name: Detect changes
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo para comparar contra la rama base, pero
          # sin el contenido de los archivos (`blob:none`): para listar
          # rutas modificadas basta con los árboles. Solo se escribe en
          # disco la raíz y `.github/`.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - name: Calcular componentes afectados
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # `--no-renames`: la detección de renombres necesitaría el
          # contenido de los archivos, que no se descargó. Un renombre
          # aparece como borrado + alta, y ambas rutas cuentan.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            CHANGED="$(git diff --name-only --no-renames "origin/${BASE_REF}...HEAD")"
          elif [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only --no-renames "${BEFORE_SHA}..HEAD")"
          else
            # Rama nueva o historial no disponible: se ejecuta todo.
            CHANGED="ALL"
          fi

          echo "--- Archivos modificados ---"
          echo "${CHANGED}"

          # Existe en el commit, aunque no esté escrito en disco por el
          # sparse checkout. `ls-tree` solo lee árboles.
          exists() {
            [ -n "$(git ls-tree HEAD -- "$1")" ]
          }

          # Un cambio en los propios workflows revalida todo.
          touched() {
            [ "${CHANGED}" = "ALL" ] || grep -Eq "^($1/|\.github/workflows/)" <<< "${CHANGED}"
          }

          APP=false
          if exists backend/requirements.txt; then
            if touched backend || touched frontend; then APP=true; fi
          else
            echo "::notice::backend/requirements.txt no existe todavía: job App omitido."
          fi

          echo "app=${APP}" >> "$GITHUB_OUTPUT"

          {
            echo "### Componentes"
            echo ""
            echo "| Componente | Se ejecuta |"
            echo "|---|---|"
            echo "| backend + frontend | \`${APP}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------
  # 2. App — Python 3.12 + pytest (API y, si existen, pruebas e2e)
  # ----------------------------------------------------------
  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # Las pruebas del navegador usan el Google Chrome que ya trae el runner
      # de Ubuntu: no se descarga Chromium ni se instalan paquetes del sistema
      # (más rápido, y no depende de los espejos de apt).
      - name: Pruebas
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: python -m pytest

  # ----------------------------------------------------------
  # 4. CI Gate — el check obligatorio
  # ----------------------------------------------------------
  # `always()`: se ejecuta aunque un job previo falle. Sin esto el
  # gate quedaría en "skipped" y el ruleset lo daría por bueno.
  # En un Draft se salta entero; un Draft no se puede integrar, y al
  # marcarlo como listo la CI vuelve a correr sobre el mismo commit.
  # Al añadir un job de componente, agregarlo también a `needs:`.
  # ----------------------------------------------------------
  ci-gate:
    name: CI Gate
    needs: [changes, app]
    if: always() && (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Evaluar resultados
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          {
            echo "### CI Gate"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<< "${NEEDS_JSON}"
          } >> "$GITHUB_STEP_SUMMARY"

          # `skipped` es válido: ese componente no cambió o aún no existe.
          FAILED="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "${NEEDS_JSON}")"
          if [ -n "${FAILED}" ]; then
            echo "::error::La CI falló en: ${FAILED//$'\n'/, }"
            exit 1
          fi

          echo "Todos los jobs pasaron (o no aplicaban)."
